<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{base_url}}img/feature.jpg">
<meta property="og:type" content="website">
{{heads}}
<link rel="icon" type="image/png" href="{{root}}favicon.png">
<link rel="apple-touch-icon" href="{{root}}apple-touch-icon.png">
<link rel="stylesheet" href="{{root}}style.css">
</head>
<body class="page-{{page}}">
<a class="skip" href="#main">{{skip}}</a>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="{{home}}">
      <img src="{{root}}img/icon-96.png" width="40" height="40" alt="">
      <span>{{app}}</span>
    </a>
    <nav class="nav" aria-label="{{app}}">
{{nav}}
    </nav>
  </div>
</header>
<main id="main">
{{body}}
</main>
<footer class="foot">
  <div class="wrap foot-row">
    <p>© {{year}} {{developer}} · <a href="mailto:{{email}}">{{contact}}: {{email}}</a></p>
    <nav class="langs" aria-label="{{languages}}">
{{switch}}
    </nav>
  </div>
</footer>
</body>
</html>
